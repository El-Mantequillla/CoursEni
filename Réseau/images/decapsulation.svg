<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" width="1040" height="640" role="img" aria-label="Décapsulation : le récepteur retire une enveloppe à chaque couche"><title>Décapsulation : le récepteur retire une enveloppe à chaque couche</title><desc>Les cinq couches avec la PDU correspondante et les en-têtes ajoutés ou retirés.</desc><defs><marker id="mea580c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker></defs><rect x="0.75" y="0.75" width="1038.5" height="638.5" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="30" y="40" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937" text-anchor="start">Décapsulation : le récepteur retire une enveloppe à chaque couche</text><rect x="30" y="50" width="56" height="4" rx="2" fill="#ea580c" stroke="none" stroke-width="1.5"/><rect x="24" y="84" width="190" height="56" rx="12" fill="#7c3aed" stroke="none" stroke-width="1.5"/><text x="119" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Application</text><text x="119" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#ffffff" text-anchor="middle" opacity="0.95">PDU : données</text><rect x="236" y="84" width="167" height="56" rx="8" fill="#7c3aed" stroke="none" stroke-width="1.5"/><text x="319.5" y="117.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">DONNÉES</text><text x="740" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">Reçoit les données : le service</text><text x="740" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1f2937" text-anchor="start">(ex. serveur web) trai