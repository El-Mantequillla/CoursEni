<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" role="img" aria-label="DHCP : le processus DORA"><title>DHCP : le processus DORA</title><desc>Discover, Offer, Request, Acknowledge.</desc><defs><marker id="m059669" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="m2563eb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="488.5" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="30" y="40" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937" text-anchor="start">DHCP : le processus DORA</text><rect x="30" y="50" width="56" height="4" rx="2" fill="#059669" stroke="none" stroke-width="1.5"/><rect x="100" y="76" width="180" height="38" rx="19.0" fill="#059669" stroke="none" stroke-width="1.5"/><text x="190.0" y="100.6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Client</text><rect x="600" y="76" width="180" height="38" rx="19.0" fill="#475569" stroke="none" stroke-width="1.5"/><text x="690.0" y="100.6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Serveur DHCP</text><line x1="190" y1="118" x2="190" y2="426" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"/><line x1="690" y1="118" x2="690" y2="426" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"/><line x1="194" y1="170" x2="682" y2="170" stroke="#059669" stroke-width="3" stroke-linecap="round" marker-end="url(#m059669)"/><rect x="377.85" y="134" width="124.3" height="26" rx="6" fill="#059669" stroke="none" stroke-width="1.5"/><text x="440.0" y="152.25" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">D  Discover</text><text x="440" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="middle">« Y a-t-il un serveur DHCP ? » (broadcast)</text><line x1="686" y1="246" x2="198" y2="246" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#m2563eb)"/><rect x="391.8" y="210" width="96.4" height="26" rx="6" fill="#2563eb" stroke="none" stroke-width="1.5"/><text x="440.0" y="228.25" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">O  Offer</text><text x="440" y="268" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="middle">« Je te propose cette adresse IP »</text><line x1="194" y1="322" x2="682" y2="322" stroke="#059669" stroke-width="3" stroke-linecap="round" marker-end="url(#m059669)"/><rect x="382.5" y="286" width="115.0" height="26" rx="6" fill="#059669" stroke="none" stroke-width="1.5"/><text x="440.0" y="304.25" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">R  Request</text><text x="440" y="344" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="middle">« Je voudrais utiliser cette adresse »</text><line x1="686" y1="398" x2="198" y2="398" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#m2563eb)"/><rect x="363.9" y="362" width="152.2" height="26" rx="6" fill="#2563eb" stroke="none" stroke-width="1.5"/><text x="440.0" y="380.25" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">A  Acknowledge</text><text x="440" y="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="middle">« Confirmé : IP, masque, passerelle, DNS »</text><text x="30" y="462" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">Ports UDP : 68 côté client, 67 côté serveur.</text></svg>