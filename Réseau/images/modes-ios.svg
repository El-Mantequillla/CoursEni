ion utilisateur</text><rect x="58" y="112" width="49.9" height="28" rx="6" fill="#1f2937" stroke="none" stroke-width="1.5"/><text x="82.95" y="131.25" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">S1&gt;</text><text x="58" y="166" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">Lecture limitée : surveillance et tests de base</text><rect x="30" y="215" width="400" height="110" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect x="30" y="215" width="10" height="110" rx="5" fill="#2563eb" stroke="none" stroke-width="1.5"/><text x="58" y="245" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">Mode d'exécution privilégié</text><rect x="58" y="257" width="49.9" height="28" rx="6" fill="#1f2937" stroke="none" stroke-width="1.5"/><text x="82.95" y="276.25" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">S1#</text><text x="58" y="311" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">Toutes les commandes : show, copy, reload, clock set</text><rect x="30" y="360" width="400" height="110" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="2"/><rect x="30" y="360" width="10" height="110" rx="5" fill="#059669" stroke="none" stroke-width="1.5"/><text x="58" y="390" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">Configuration globale</text><rect x="58" y="402" width="124.3" height="28" rx="6" fill="#1f2937" stroke="none" stroke-width="1.5"/><text x="120.15" y="421.25" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">S1(config)#</text><text x="58" y="456" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">hostname, enable secret, banner, ip default-gateway</text><line x1="120" y1="182" x2="120" y2="213" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" marker-end="url(#m2563eb)"/><text x="132" y="202" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="15" font-weight="700" fill="#2563eb" text-anchor="start">enable</text><line x1="330" y1="213" x2="330" y2="182" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#m475569)"/><text x="342" y="202" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="15" font-weight="700" fill="#475569" text-anchor="start">disable</text><line x1="120" y1="327" x2="120" y2="358" stroke="#059669" stroke-width="2.5" stroke-linecap="round" marker-end="url(#m059669)"/><text x="132" y="348" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="15" font-weight="700" fill="#059669" text-anchor="start">configure terminal</text><line x1="360" y1="358" x2="360" y2="327" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#m475569)"/><text x="372" y="348" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="15" font-weight="700" fill="#475569" text-anchor="start">end / Ctrl+Z</text><text x="30" y="560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748b" text-anchor="start">exit remonte d'un seul niveau ; end et Ctrl+Z reviennent directement au mode privilégié.</text><text x="580" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#64748b" text-anchor="start">Sous-modes, depuis la configuration globale</text><rect x="580" y="252" width="330" height="90" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><rect x="580" y="252" width="10" height="90" rx="5" fill="#7c3aed" stroke=