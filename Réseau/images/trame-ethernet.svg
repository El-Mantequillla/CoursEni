erif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">46 à 1500 octets</text><text x="688.0" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">Le paquet de la couche 3</text><text x="688.0" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">(en-tête IP + segment)</text><rect x="870" y="104" width="96" height="70" rx="8" fill="#9a3412" stroke="none" stroke-width="1.5"/><text x="918.0" y="146" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">FCS</text><text x="918.0" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">4 octets</text><text x="918.0" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">Contrôle</text><text x="918.0" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">d'erreurs</text><path d="M30 92 L30 84 L506 84 L506 92" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="268.0" y="76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">En-tête : 22 octets</text><path d="M870 92 L870 84 L966 84 L966 92" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="918.0" y="76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">Fin : 4 octets</text><rect x="30" y="270" width="940" height="40" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="500" y="296" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="1