<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="La trame Ethernet"><title>La trame Ethernet</title><desc>Préambule, adresses MAC destination et source, type, données et FCS.</desc><defs></defs><rect x="0.75" y="0.75" width="998.5" height="328.5" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="30" y="40" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937" text-anchor="start">La trame Ethernet</text><rect x="30" y="50" width="56" height="4" rx="2" fill="#ea580c" stroke="none" stroke-width="1.5"/><rect x="30" y="104" width="106" height="70" rx="8" fill="#475569" stroke="none" stroke-width="1.5"/><text x="83.0" y="146" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Préambule</text><text x="83.0" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">8 octets</text><text x="83.0" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">Synchronisation</text><text x="83.0" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">émetteur / récepteur</text><rect x="140" y="104" width="136" height="70" rx="8" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="208.0" y="146" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">MAC destination</text><text x="208.0" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2937" text-anchor="middle">6 octets</text><text x="208.0" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="middle">Adresse du</text><text 