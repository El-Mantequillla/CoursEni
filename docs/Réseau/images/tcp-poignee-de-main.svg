<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" role="img" aria-label="TCP : la poignée de main en trois temps"><title>TCP : la poignée de main en trois temps</title><desc>SYN, SYN-ACK, ACK puis échange de données et fermeture avec FIN.</desc><defs><marker id="m059669" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="m2563eb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="mdc2626" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect x="0.75" y="0.75" width="878.5" height="488.5" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="30" y="40" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937" text-anchor="start">TCP : la poignée de main en trois temps</text><rect x="30" y="50" width="56" height="4" rx="2" fill="#2563eb" stroke="none" stroke-width="1.5"/><rect x="100" y="76" width="180" height="38" rx="19.0" fill="#2563eb" stroke="none" stroke-width="1.5"/><text x="190.0" y="100.6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Client</text><rect x="600" y="76" width="180" height="38" rx="19.0" fill="#475569" stroke="none" stroke-width="1.5"/><text x="690.0" y="100.6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Serveur</text><line x1="190" y1="118" x2="190" y2="470" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"/><line x1="690" y1="118" x2="690" y2="470" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 7"/><line x1="194" y1="170" x2="682" y2="170" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#m2563eb)"/><rect x="415.05" y="134" width="49.9" height="26" rx="6" fill="#2563eb" stroke="none" stroke-width="1.5"/><text x="440.0" y="152.25" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">SYN</text><text x="440" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="middle">Le client demande une connexion</text><line x1="686" y1="246" x2="198" y2="246" stroke="#059669" stroke-width="3" stroke-linecap="round" marker-end="url(#m059669)"/><rect x="391.8" y="210" width="96.4" height="26" rx="6" fill="#059669" stroke="none" stroke-width="1.5"/><text x="440.0" y="228.25" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">SYN, ACK</text><text x="440" y="268" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="middle">Le serveur accepte</text><line x1="194" y1="322" x2="682" y2="322" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#m2563eb)"/><rect x="415.05" y="286" width="49.9" height="26" rx="6" fill="#2563eb" stroke="none" stroke-width="1.5"/><text x="440.0" y="304.25" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">ACK</text><text x="440" y="344" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="middle">Le client confirme : la connexion est ouverte</text><rect x="200" y="362" width="480" height="40" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="440" y="387" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2563eb" text-anchor="middle">Échange de données : segments numérotés, chacun confirmé par un ACK</text><line x1="194" y1="462" x2="682" y2="462" stroke="#dc2626" stroke-width="3" stroke-linecap="round" marker-end="url(#mdc2626)"/><text x="440" y="448" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#dc2626" text-anchor="middle">FIN : fermeture de la connexion</text></svg>