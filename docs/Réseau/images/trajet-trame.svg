ses IP et ports : identiques de bout en bout</text><rect x="540" y="478" width="500" height="48" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="790" y="508" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#9a3412" text-anchor="middle">Adresses MAC : changent à chaque saut</text><text x="30" y="558" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start">Le switch lit seulement la MAC de destination. Le routeur lit l'IP de destination et diminue le TTL de 1.</text></svg>