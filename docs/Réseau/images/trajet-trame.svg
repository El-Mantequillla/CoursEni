<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 580" width="1060" height="580" role="img" aria-label="Le trajet d'une requête web : ce qui change et ce qui ne change pas"><title>Le trajet d'une requête web : ce qui change et ce qui ne change pas</title><desc>Les adresses IP et les ports restent identiques de bout en bout, les adresses MAC changent à chaque saut.</desc><defs></defs><rect x="0.75" y="0.75" width="1058.5" height="578.5" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="30" y="40" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937" text-anchor="start">Le trajet d'une requête web : ce qui change et ce qui ne change pas</text><rect x="30" y="50" width="56" height="4" rx="2" fill="#ea580c" stroke="none" stroke-width="1.5"/><rect x="30" y="72" width="150" height="92" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="105.0" y="106" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">PC1</text><text x="105.0" y="132" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="14" font-weight="400" fill="#64748b" text-anchor="middle">192.168.1.10</text><rect x="250" y="72" width="140" height="92" rx="12" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/><text x="320.0" y="106" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Switch S1</text><text x="320.0" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748b" text-anchor="middle">couche 2</text><rect x="490" y="72" width="180" height="92" rx="12" fill="#d1fae5" stroke="#059669" stroke-width="2.5"/><text x="580.0" y="106" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">Routeur R1</text><text x="580.0" y="128" font-family="Consolas, 'De