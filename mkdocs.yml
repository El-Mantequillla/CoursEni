site_name: Mes notes
theme:
  name: material
  language: fr
  features:
    - content.code.copy      # bouton "copier" sur les blocs de code

markdown_extensions:
  - toc:                    # ancres des titres identiques à GitHub (liens du sommaire)
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - tables
  - attr_list
  - md_in_html
  - pymdownx.highlight      # coloration syntaxique du PowerShell
  - pymdownx.superfences:   # affichage des schémas Mermaid
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
